services:
  - type: web
    name: heroisdaescola-room-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: ENABLE_TELEGRAM
        value: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
